function moveIn(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }

/* categories */
function openCategories() {
  const render = ctx => {
    ctx.setBody(`<div class="hint" style="margin:0 2px 10px">點分類可以設定它的提醒預設；商品可以再個別調整。</div>
      <div class="list">${S.categories.map((c, i) => {
        const n = S.products.filter(p => p.categoryId === c.id).length;
        const plan = planById(c.planId) || planById(S.settings.defaultPlanId);
        const flags = [c.exp ? `到期・${plan?.name}` : '到期關', c.low ? '低庫存' : '低庫存關', c.forecast ? '快用完' : '快用完關'].join('、');
        return `<div class="edit-row"><div class="grow tap" data-edit="${c.id}"><div style="font-weight:600">${esc(c.name)} <span class="muted small">${n} 項</span></div><div class="small muted ellipsis">${esc(flags)}</div></div>
          <button class="icon-btn" data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="上移">${ic('up')}</button>
          <button class="icon-btn" data-down="${i}" ${i === S.categories.length - 1 ? 'disabled' : ''} aria-label="下移">${ic('down')}</button></div>`;
      }).join('')}</div>`);
    ctx.setFoot(`<button class="btn primary block" data-add>${ic('plus')}新增分類</button>`);
    ctx.$$('[data-up]').forEach(b => b.onclick = () => { moveIn(S.categories, +b.dataset.up, -1); commit(); });
    ctx.$$('[data-down]').forEach(b => b.onclick = () => { moveIn(S.categories, +b.dataset.down, 1); commit(); });
    ctx.$$('[data-edit]').forEach(b => b.onclick = () => editCategory(b.dataset.edit));
    ctx.$('[data-add]').onclick = async () => {

const b64 = { enc: u8 => { let s = ''; u8.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); }, dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
function validState(d) { return d && Array.isArray(d.products) && Array.isArray(d.batches) && Array.isArray(d.categories) && Array.isArray(d.areas) && d.settings; }

function openBackup() {
  const render = ctx => {
    const last = S.settings.lastBackupAt;
    ctx.setBody(`
      <div class="card"><div class="row">${ic('backup')}<div class="grow"><b>${last ? `上次備份：${fmtDate(toISO(new Date(last)))}` : '還沒有備份過'}</b>

      <div class="switch-row" style="padding:6px 2px 12px;border:0"><div class="grow"><div>${ic('lock').replace('<svg', '<svg style="width:16px;height:16px;vertical-align:-2px"')} 用密碼加密備份</div><div class="small muted">忘記密碼就無法還原，請記好</div></div><label class="switch"><input type="checkbox" data-enc><span></span></label></div>
      <div class="hint" style="margin:0 2px 10px">備份包含所有商品資料和照片，不包含 AI 金鑰。</div>
      <button class="btn primary block" data-share>${ic('backup')}備份並分享到雲端硬碟…</button>
      <div class="hint" style="margin:6px 2px 10px">會跳出分享選單，選「雲端硬碟」即可存起來，也可以選 Email 或其他 App。</div>
      <button class="btn block" data-dl>${ic('in')}下載備份檔到手機</button>
      <div class="hint" style="margin:6px 2px 0">存在手機的「下載」資料夾。手機壞掉時會一起不見，建議另外存到雲端。</div>
      <div class="hr" style="margin:18px 0"></div>
      <button class="btn block" data-restore>${ic('restore')}從備份檔還原</button>
      <input type="file" accept=".json,.txt,application/json,text/plain" data-file hidden>
      <div class="hint" style="margin:6px 2px 0">還原會用備份檔<b>取代</b>目前手機裡的所有資料。</div>`);
    const enc = ctx.$('[data-enc]');
    const make = async () => {
      let pw = null;
      if (enc.checked) {
        pw = await promptDialog('設定備份密碼', { type: 'password', label: '密碼', hint: '還原時需要輸入這組密碼' });
        if (!pw) return null;
        const pw2 = await promptDialog('再輸入一次密碼', { type: 'password' });
        if (pw !== pw2) { toast('兩次密碼不一樣'); return null; }
      }
      return buildBackup(pw);
    };
    const name = ext => `home-pantry-backup_${todayISO()}.${ext}`;
    const markDone = () => { S.settings.lastBackupAt = Date.now(); commit(); };
    ctx.$('[data-share]').onclick = async () => {
      const text = await make(); if (!text) return;
      const file = new File([text], name('txt'), { type: 'text/plain' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: '家庭庫存備份' }); markDone(); toast('備份完成'); }
        catch (e) { if (e.name !== 'AbortError') { toast('分享失敗，改用下載'); download(text, name('json')); markDone(); } }
      } else { download(text, name('json')); markDone(); toast('這台手機不支援分享，已改為下載'); }
    };
    ctx.$('[data-dl]').onclick = async () => { const text = await make(); if (!text) return; download(text, name('json')); markDone(); toast('已下載備份檔'); };
    const fi = ctx.$('[data-file]');
    ctx.$('[data-restore]').onclick = () => { fi.value = ''; fi.click(); };
    fi.onchange = async () => {
      const f = fi.files[0]; if (!f) return;
      try {
        const bk = await readBackup(await f.text(), () => promptDialog('輸入備份密碼', { type: 'password' }));
        const data = bk.state;
        if (!validState(data)) throw new Error('備份檔內容不完整');
        const nPh = Object.keys(bk.photos).length;

function download(text, filename) {

  document.body.appendChild(a); a.click();

}

function migrate(d) {
  const base = defaultState();
  d.settings = { ...base.settings, ...(d.settings || {}) };
  for (const k of ['plans', 'categories', 'areas', 'products', 'batches', 'logs', 'shopping']) if (!Array.isArray(d[k])) d[k] = base[k];
  if (!d.plans.length) d.plans = base.plans;
  d.products.forEach(p => { p.barcodes = p.barcodes || []; p.packs = p.packs || []; p.alerts = p.alerts || {}; p.baseUnit = p.baseUnit || '個'; p.photos = p.photos || []; });
  if (d.settings.stocktakeStart == null) d.settings.stocktakeStart = Date.now();
  if (d.settings.seenVersion == null && d.settings.onboarded) d.settings.seenVersion = '1.0.0';
  d.schema = 2;
  return d;
}

IDB.del = async function (k) {

const Photos = {
  cache: new Map(),
  async get(id) {
    if (!id) return null;
    if (this.cache.has(id)) return this.cache.get(id);
    const v = await IDB.get('photo:' + id).catch(() => null);
    if (v) this.cache.set(id, v);
    return v || null;
  },
  async put(id, data) { await IDB.set('photo:' + id, data); this.cache.set(id, data); },
  async del(id) { await IDB.del('photo:' + id).catch(() => {}); this.cache.delete(id); },
  async all() {
    const out = {};
    for (const k of await IDB.keys()) if (String(k).startsWith('photo:')) out[k.slice(6)] = await IDB.get(k);

};

/* ---------- image helpers ---------- */
function toCanvas(src, sx = 0, sy = 0, sw, sh, maxSide = 4096) {
  const W = src.videoWidth || src.naturalWidth || src.width, H = src.videoHeight || src.naturalHeight || src.height;
  sw = sw ?? W; sh = sh ?? H;
  const k = Math.min(1, maxSide / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * k)); c.height = Math.max(1, Math.round(sh * k));
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
function thumbOf(canvas, size = 160) {
  const s = Math.min(canvas.width, canvas.height);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.drawImage(canvas, (canvas.width - s) / 2, (canvas.height - s) / 2, s, s, 0, 0, size, size);
  const d = c.toDataURL('image/jpeg', .72); c.width = c.height = 0;
  return d;
}
function makePhoto(canvas) {
  const full = toCanvas(canvas, 0, 0, undefined, undefined, 900);
  const p = { id: uid(), thumb: thumbOf(canvas), full: full.toDataURL('image/jpeg', .8) };
  full.width = full.height = 0;
  return p;
}
async function fileToCanvas(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(file));
  const c = toCanvas(bmp, 0, 0, bmp.width, bmp.height, 2000);
  bmp.close?.();
  return c;
}
function pickImageFile() {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
    i.onchange = () => res(i.files[0] || null);
    i.click();
  });
}
function grabFrame(video) { return toCanvas(video, 0, 0, video.videoWidth, video.videoHeight, 4096); }
async function hiResSnapshot(video) {
  // 優先使用相機的正式拍照（解析度較高），比例與預覽相同時才採用，以便對應框的位置
  const vw = video.videoWidth, vh = video.videoHeight;
  try {
    const track = Cam.stream?.getVideoTracks()[0];
    if (track && 'ImageCapture' in window) {
      const blob = await Promise.race([new ImageCapture(track).takePhoto(), new Promise((_, r) => setTimeout(() => r(new Error('t')), 4000))]);
      const bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' });
      if (Math.abs(bmp.width / bmp.height - vw / vh) < .03 && bmp.width > vw) return { src: bmp, scale: bmp.width / vw };
      bmp.close?.();
    }
  } catch (e) { /* fall back */ }
  return { src: video, scale: 1 };
}
// 依畫面上框的位置，換算成影片像素座標
function frameRectInVideo(video, frameEl) {
  const fr = frameEl.getBoundingClientRect(), vr = video.getBoundingClientRect();
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(vr.width / vw, vr.height / vh);
  const ox = (vr.width - vw * scale) / 2, oy = (vr.height - vh * scale) / 2;
  let x = (fr.left - vr.left - ox) / scale, y = (fr.top - vr.top - oy) / scale, w = fr.width / scale, h = fr.height / scale;
  x = Math.max(0, x); y = Math.max(0, y); w = Math.min(vw - x, w); h = Math.min(vh - y, h);
  return { x, y, w, h };
}

/* ---------- Open Food Facts ---------- */
async function offLookup(code, withPhoto = true) {
  if (!navigator.onLine || !/^\d{6,14}$/.test(code)) return null;
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 6000);
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_zh,product_name_en,brands,quantity,image_front_url,image_url`, { signal: ctrl.signal });
    if (!r.ok) return null;
    const j = await r.json();
    if (j.status !== 1 || !j.product) return null;
    const p = j.product;
    const base = (p.product_name_zh || p.product_name || p.product_name_en || '').trim();
    const brand = (p.brands || '').split(',')[0].trim();
    let name = base;
    if (brand && !base.toLowerCase().includes(brand.toLowerCase())) name = `${brand} ${base}`.trim();
    if (p.quantity && !name.includes(p.quantity)) name = `${name} ${p.quantity}`.trim();
    if (!name) return null;
    let photo = null;
    const img = p.image_front_url || p.image_url;
    if (withPhoto && img) {
      try {
        const ir = await fetch(img, { signal: ctrl.signal, mode: 'cors' });
        if (ir.ok) { const c = await fileToCanvas(await ir.blob()); photo = makePhoto(c); c.width = c.height = 0; }
      } catch (e) { /* 圖片抓不到就只用名稱 */ }
    }
    return { name, photo };
  } catch (e) { return null; } finally { clearTimeout(t); }
}

function pickProduct(onPick, { preferNoBarcode = false } = {}) {
  let q = '';
  const row = p => `<div class="item tap" data-pick="${p.id}">${thumbHTML(p)}<div class="main"><div class="name">${esc(p.name)}</div><div class="meta">${esc(catById(p.categoryId)?.name || '')}${(p.barcodes || []).length ? '' : '・<span>未綁定條碼</span>'}</div></div><div class="qty">${esc(fmtQty(p, stockOf(p)))}</div></div>`;
  const render = ctx => {
    const all = S.products.filter(p => !q || p.name.toLowerCase().includes(q.toLowerCase())).sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
    let h = '';
    if (preferNoBarcode && !q) {
      const recent = S.products.filter(p => !(p.barcodes || []).length).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 8);
      if (recent.length) h += `<div class="section-title" style="margin-top:4px"><span>最近建立、還沒有條碼</span></div><div class="list">${recent.map(row).join('')}</div><div class="section-title"><span>全部商品</span></div>`;

    ctx.$$('[data-pick]').forEach(el => el.onclick = async () => { const p = prodById(el.dataset.pick); await closeTop(); onPick(p); });
  };
  sheet({
    title: '選擇商品', full: true,
    body: `<label class="search" style="margin-top:0">${ic('search')}<input type="search" placeholder="搜尋商品" data-s></label><div data-list></div>`,
    onMount: ctx => {

      s.addEventListener('input', e => { if (e.isComposing) return; q = s.value; render(ctx); });
      s.addEventListener('compositionend', () => { q = s.value; render(ctx); });
    },
  });
}

const AI = { key: null, model: null, forDates: true };
async function loadAI() {

async function saveAI() { await IDB.set('ai', { key: AI.key, model: AI.model, forDates: AI.forDates }); }
const aiReady = () => !!(AI.key && navigator.onLine);

class AIError extends Error {
  constructor(code, detail = '') { super(code); this.code = code; this.detail = detail; }
  get zh() {
    return ({
      nokey: '還沒有設定 AI 金鑰', offline: '目前沒有網路', timeout: 'AI 回應太久，請再試一次', network: '連不上 AI 服務',
      quota: '免費額度暫時用完了，請等一下再試', badkey: '金鑰無效，請到設定檢查', model: '找不到這個 AI 模型，請到設定重新測試金鑰',
      parse: 'AI 的回應看不懂，請再試一次', bad: 'AI 拒絕了這個請求', http: 'AI 服務發生錯誤',
    })[this.code] || 'AI 發生錯誤';
  }
}
const GEM = 'https://generativelanguage.googleapis.com/v1beta';
function parseLooseJSON(t) {
  t = String(t || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(t); } catch (e) {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw new AIError('parse');
}
async function geminiCall(parts, { model = AI.model, timeout = 60000, json = true } = {}) {
  if (!AI.key) throw new AIError('nokey');
  if (!navigator.onLine) throw new AIError('offline');
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), timeout);
  let res;
  try {
    res = await fetch(`${GEM}/models/${model || 'gemini-2.5-flash'}:generateContent`, {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': AI.key },
      body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig: { temperature: .2, ...(json ? { responseMimeType: 'application/json' } : {}) } }),
    });
  } catch (e) { throw new AIError(e.name === 'AbortError' ? 'timeout' : 'network'); } finally { clearTimeout(t); }
  if (res.status === 429) throw new AIError('quota');
  if (res.status === 404) throw new AIError('model');
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    const msg = j.error?.message || '';
    if (/api key|API_KEY|permission/i.test(msg) || res.status === 401 || res.status === 403) throw new AIError('badkey', msg);
    if (/quota|exhausted|limit/i.test(msg)) throw new AIError('quota', msg);
    throw new AIError(res.status === 400 ? 'bad' : 'http', msg);
  }
  const j = await res.json();
  const text = (j.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
  if (!text) throw new AIError('parse');
  return json ? parseLooseJSON(text) : text;
}
const imgPart = canvas => ({ inline_data: { mime_type: 'image/jpeg', data: canvas.toDataURL('image/jpeg', .85).split(',')[1] } });

async function geminiModels() {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 15000);
  let res;
  try { res = await fetch(`${GEM}/models?pageSize=200`, { headers: { 'x-goog-api-key': AI.key }, signal: ctrl.signal }); }
  catch (e) { throw new AIError(e.name === 'AbortError' ? 'timeout' : 'network'); } finally { clearTimeout(t); }
  if (!res.ok) throw new AIError(res.status === 429 ? 'quota' : 'badkey');
  const j = await res.json();
  const ver = n => (n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] * 1 || 0;
  return (j.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace(/^models\//, ''))
    .filter(n => /^gemini-\d+(\.\d+)?-flash(-lite)?(-latest)?$/.test(n))
    .sort((a, b) => ver(b) - ver(a) || (a.includes('lite') - b.includes('lite')));
}
async function geminiSetup(onStatus) {
  onStatus('檢查金鑰…');
  const models = await geminiModels();
  if (!models.length) throw new AIError('model');
  let lastErr = null;
  for (const m of models.slice(0, 6)) {
    onStatus(`測試 ${m}…`);
    try {
      const r = await geminiCall([{ text: '只回傳 JSON：{"ok":true}' }], { model: m, timeout: 20000 });
      if (r && r.ok) { AI.model = m; await saveAI(); return { model: m, models }; }
    } catch (e) { lastErr = e; if (e.code === 'badkey') throw e; }
  }
  throw lastErr || new AIError('model');
}

   ========================================================= */
const TESS_SRC_V = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let tessW = null;
async function getTessWorker(onStatus) {
  if (tessW) return tessW;
  onStatus('第一次使用，正在下載辨識資料…');
  await loadScript(TESS_SRC_V);
  tessW = await Tesseract.createWorker('eng', 1, {
    logger: m => { if (m.status && m.progress != null && /load|initializ/i.test(m.status)) onStatus(`準備辨識中 ${Math.round(m.progress * 100)}%`); },
  });
  return tessW;
}
function ocrVariant(src, kind) {
  // kind: plain | dots | big
  const up = kind === 'big' ? 2 : 1;
  const c = toCanvas(src, 0, 0, src.width, src.height, Math.max(src.width, src.height) * up);
  const w = c.width, h = c.height, g = c.getContext('2d', { willReadFrequently: true });
  const img = g.getImageData(0, 0, w, h), d = img.data;
  let a = new Float32Array(w * h);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) a[j] = d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114;
  if (kind === 'dots' || kind === 'big') {
    const r = Math.max(1, Math.round(w / (kind === 'big' ? 700 : 450)));
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
    for (let y = 0; y < h; y++) { let s = 0; for (let x = -r; x <= r; x++) s += a[y * w + Math.min(w - 1, Math.max(0, x))]; for (let x = 0; x < w; x++) { tmp[y * w + x] = s / (2 * r + 1); s += a[y * w + Math.min(w - 1, x + r + 1)] - a[y * w + Math.max(0, x - r)]; } }
    for (let x = 0; x < w; x++) { let s = 0; for (let y = -r; y <= r; y++) s += tmp[Math.min(h - 1, Math.max(0, y)) * w + x]; for (let y = 0; y < h; y++) { out[y * w + x] = s / (2 * r + 1); s += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; } }
    a = out;
  }
  const hist = new Array(256).fill(0);
  for (const v of a) hist[Math.max(0, Math.min(255, v | 0))]++;
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, th = 127; const total = a.length;
  for (let i = 0; i < 256; i++) { wB += hist[i]; if (!wB) continue; const wF = total - wB; if (!wF) break; sumB += i * hist[i]; const mB = sumB / wB, mF = (sum - sumB) / wF; const bt = wB * wF * (mB - mF) ** 2; if (bt > best) { best = bt; th = i; } }
  let dark = 0; for (const v of a) if (v < th) dark++;
  const inv = dark > total * .55;
  for (let j = 0, i = 0; j < a.length; j++, i += 4) { let v = a[j] < th ? 0 : 255; if (inv) v = 255 - v; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  return c;
}
async function localDateOCR(crop, onStatus) {
  const w = await getTessWorker(onStatus);
  let text = '', dates = [];
  const plan = [['plain', '6'], ['dots', '6'], ['plain', '7'], ['big', '7']];
  for (const [kind, psm] of plan) {
    onStatus('辨識中…');
    const v = ocrVariant(crop, kind);
    await w.setParameters({ tessedit_pageseg_mode: psm, preserve_interword_spaces: '1' });
    const r = await w.recognize(v);
    v.width = v.height = 0;
    const t = (r.data.text || '').trim();
    if (t) text += (text ? '\n' : '') + t;
    dates = DateParse.parse(text);
    if (dates.length) break;
  }
  return { text, dates };
}
async function aiDateOCR(crop) {
  const r = await geminiCall([
    { text: '這是商品包裝上印有日期的區域。請讀出上面的日期，只回傳 JSON：{"text":"你看到的原始文字","dates":[{"date":"YYYY-MM-DD","kind":"expiry|manufacture|unknown"}]}。民國年請換算成西元（例如 115 年 = 2026 年）。只有年月時用該月最後一天。點陣字、噴墨字也請盡量辨識。看不清楚就回傳空陣列。' },
    imgPart(crop),
  ], { timeout: 30000 });
  const order = { expiry: 0, unknown: 1, manufacture: 2 };
  const list = (r.dates || []).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d.date) && !isNaN(parseISO(d.date)))
    .sort((a, b) => (order[a.kind] ?? 1) - (order[b.kind] ?? 1));
  return { text: r.text || '', dates: [...new Set(list.map(d => d.date))], kinds: Object.fromEntries(list.map(d => [d.date, d.kind])) };
}

/* =========================================================
   AI photo product creation (front + barcode side)
   ========================================================= */
function normName(s) { return String(s || '').toLowerCase().replace(/[\s\-_.,，、。()（）\[\]【】「」'"/]+/g, ''); }
function similar(a, b) {
  a = normName(a); b = normName(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  if (a.length >= 3 && b.length >= 3 && (a.includes(b) || b.includes(a))) return .85;
  const grams = s => { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); } return m; };
  const A = grams(a), B = grams(b); let inter = 0, tot = 0;
  for (const [g, n] of A) { inter += Math.min(n, B.get(g) || 0); tot += n; }
  for (const n of B.values()) tot += n;
  return tot ? 2 * inter / tot : 0;
}
function findSimilarProduct(name) {
  let best = null, score = 0;
  for (const p of S.products) { const s = similar(name, p.name); if (s > score) { score = s; best = p; } }
  return score >= .6 ? best : null;
}
async function detectBarcodesIn(canvas) {
  if (!('BarcodeDetector' in window)) return [];
  try {
    const sup = await BarcodeDetector.getSupportedFormats();
    const d = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code'].filter(f => sup.includes(f)) });
    const r = await d.detect(canvas);
    const seen = new Set();
    return r.filter(x => x.rawValue && !seen.has(x.rawValue) && seen.add(x.rawValue)).map(x => ({
      code: x.rawValue,
      cx: (x.boundingBox.x + x.boundingBox.width / 2) / canvas.width * 1000,
      cy: (x.boundingBox.y + x.boundingBox.height / 2) / canvas.height * 1000,
    }));
  } catch (e) { return []; }
}
function assignBarcodes(items, codes, boxKey) {
  const free = new Set(items.map((_, i) => i));
  const pairs = [];
  for (const c of codes) {
    items.forEach((it, i) => {
      const b = it[boxKey]; if (!Array.isArray(b) || b.length !== 4) return;
      const [y0, x0, y1, x1] = b;
      const inside = c.cx >= x0 && c.cx <= x1 && c.cy >= y0 && c.cy <= y1;
      const dist = Math.hypot(c.cx - (x0 + x1) / 2, c.cy - (y0 + y1) / 2);
      const area = Math.max(1, (x1 - x0) * (y1 - y0));
      pairs.push({ c, i, s: inside ? -1e9 + area : dist });
    });
  }
  pairs.sort((a, b) => a.s - b.s);
  const used = new Set();
  for (const p of pairs) {
    if (used.has(p.c.code) || !free.has(p.i)) continue;
    if (p.s > 260) continue; // 太遠就不配
    items[p.i].barcode = p.c.code; used.add(p.c.code); free.delete(p.i);
  }
  return codes.filter(c => !used.has(c.code)).map(c => c.code);
}
function cropBox(canvas, box) {
  if (!Array.isArray(box) || box.length !== 4) return null;
  let [y0, x0, y1, x1] = box.map(Number);
  if (![y0, x0, y1, x1].every(isFinite) || y1 <= y0 || x1 <= x0) return null;
  const W = canvas.width, H = canvas.height;
  const px = (x1 - x0) * .06, py = (y1 - y0) * .06;
  x0 = Math.max(0, x0 - px); x1 = Math.min(1000, x1 + px); y0 = Math.max(0, y0 - py); y1 = Math.min(1000, y1 + py);
  const c = toCanvas(canvas, x0 / 1000 * W, y0 / 1000 * H, (x1 - x0) / 1000 * W, (y1 - y0) / 1000 * H, 1200);
  const ph = makePhoto(c); c.width = c.height = 0;
  return ph;
}

async function runAIBuild(imgs) {
  const ctx = sheet({ title: 'AI 辨識中', body: `<div class="card row"><span class="spin"></span><div class="grow"><b>正在辨識商品…</b><div class="small muted" data-st>照片已傳送給 Google，通常需要 5 到 20 秒</div></div></div>` });
  const free = () => imgs.forEach(c => { c.width = c.height = 0; });
  const alive = () => overlays.some(o => o.el === ctx.el);
  const cats = S.categories.map(c => c.name);
  const spots = S.areas.flatMap(a => a.spots.map(s => `${a.name}・${s.name}`));
  const two = imgs.length === 2;
  const small = imgs.map(c => toCanvas(c, 0, 0, c.width, c.height, 1600));
  const prompt = `${two ? '你會看到兩張照片。第 1 張是桌上幾樣商品的正面；第 2 張是同樣的商品放在差不多的位置，但每樣都轉到露出條碼的那一面。' : '這張照片裡有幾樣商品。'}
請找出照片中每一樣不同的商品，只回傳 JSON：
{"items":[{"name":"商品名稱","category":"分類","location":"放置位置","box1":[ymin,xmin,ymax,xmax]${two ? ',"box2":[ymin,xmin,ymax,xmax]' : ''}}]}
規則：
- name：台灣常用的繁體中文名稱，保留包裝上的品牌和規格，例如「舒潔衛生紙 110抽」「統一純喫茶綠茶 650ml」。認不出品牌就寫最接近的描述。
- category：只能從這些選一個：${cats.join('、')}
- location：從這些選最可能存放的位置，不確定就給空字串：${spots.join('、')}
- box1：這樣商品在第 1 張照片中的範圍${two ? '；box2：同一樣商品在第 2 張照片中的範圍' : ''}，座標是 0 到 1000 的整數，順序為 [ymin, xmin, ymax, xmax]。
- 同一樣商品只列一次；不要列出背景、桌子、手或其他非商品物品。`;
  let r;
  try {
    r = await geminiCall([{ text: prompt }, ...small.map(imgPart)], { timeout: 90000 });
  } catch (e) {
    small.forEach(c => { c.width = c.height = 0; }); free();
    if (!alive()) return;
    ctx.setTitle('辨識失敗');
    ctx.setBody(`<div class="banner">${ic('alert')}<div class="grow">${esc(e.zh || 'AI 發生錯誤')}</div></div>`);
    ctx.setFoot(`<button class="btn" data-close2>關閉</button><button class="btn primary" data-retry>重新拍照</button>`);
    ctx.$('[data-close2]').onclick = () => closeTop();

    return;
  }
  small.forEach(c => { c.width = c.height = 0; });
  if (!alive()) { free(); return; }
  ctx.$('[data-st]').textContent = '正在裁切照片、讀取條碼…';
  const raw = Array.isArray(r.items) ? r.items.filter(x => x && x.name).slice(0, 20) : [];
  const items = raw.map(x => {
    const cat = S.categories.find(c => c.name === x.category) || S.categories.find(c => c.name === '其他') || S.categories[0];
    let spotId = '';
    for (const a of S.areas) for (const s of a.spots) if (`${a.name}・${s.name}` === x.location) spotId = s.id;
    return { name: String(x.name).trim().slice(0, 60), categoryId: cat?.id || null, spotId, box1: x.box1, box2: x.box2, barcode: null, photo: cropBox(imgs[0], x.box1), checked: true };
  });
  const codes = await detectBarcodesIn(imgs[two ? 1 : 0]);
  const extra = assignBarcodes(items, codes, two ? 'box2' : 'box1');
  free();
  for (const it of items) {
    it.dup = (it.barcode && prodByBarcode(it.barcode)) || findSimilarProduct(it.name);
    it.dupByCode = !!(it.barcode && prodByBarcode(it.barcode));
    if (it.dup) it.checked = false;
  }
  await closeTop();
  if (!items.length) { toast('AI 沒有在照片中找到商品，請再拍一次'); return; }

}

/* =========================================================
   Stocktake
   ========================================================= */
function stocktakeDueAreas() {
  const days = S.settings.stocktakeDays;
  if (!days) return [];
  const base = S.settings.stocktakeStart || Date.now();
  return S.areas.filter(a => S.products.some(p => a.spots.some(s => s.id === p.spotId)))
    .filter(a => Date.now() - (a.checkedAt || base) > days * 86400000);
}
function adjustTo(p, newBase) {
  newBase = round(Math.max(0, newBase));
  const cur = stockOf(p);
  const diff = round(newBase - cur);
  if (!diff) return 0;
  if (diff < 0) {
    let left = -diff;
    for (const b of batchesOf(p)) { if (left <= 0) break; const take = Math.min(b.qty, left); b.qty = round(b.qty - take); left = round(left - take); }
    S.batches = S.batches.filter(b => b.qty > 0);
  } else {
    S.batches.push({ id: uid(), productId: p.id, qty: diff, expiry: null, addedAt: Date.now() });
  }
  S.logs.push({ id: uid(), productId: p.id, type: 'adjust', qty: diff, at: Date.now(), note: 'stocktake' });
  return diff;
}

function openStocktake() {
  const render = ctx => {
    const due = new Set(stocktakeDueAreas().map(a => a.id));
    const groups = S.areas.map(a => ({ a, n: S.products.filter(p => a.spots.some(s => s.id === p.spotId)).length }));
    const none = S.products.filter(p => !spotInfo(p.spotId)).length;
    ctx.setBody(`<div class="hint" style="margin:0 2px 10px">選一個區域開始，逐項確認實際數量。可以只盤一個區域，下次再盤別的。盤點時的修正不會算進消耗統計。</div>
      <div class="list">${groups.map(({ a, n }) => `<button class="setting-row" data-area="${a.id}" ${n ? '' : 'disabled style="opacity:.5"'}>${ic('pin', 'lead')}<span class="grow"><div style="font-weight:600">${esc(a.name)} <span class="muted small">${n} 項</span></div>
        <div class="small muted">${a.checkedAt ? `上次盤點 ${fmtDate(toISO(new Date(a.checkedAt)))}` : '還沒盤點過'}</div></span>${due.has(a.id) ? '<span class="chip warn">該盤點了</span>' : ''}${ic('chev', 'chev')}</button>`).join('')}
      ${none ? `<button class="setting-row" data-area="_none">${ic('pin', 'lead')}<span class="grow"><div style="font-weight:600">未指定位置 <span class="muted small">${none} 項</span></div></span>${ic('chev', 'chev')}</button>` : ''}</div>
      <div class="small muted" style="margin:10px 2px">每 ${S.settings.stocktakeDays} 天提醒一次，可以在「設定 → 預設值」調整。</div>`);
    ctx.$$('[data-area]').forEach(b => b.onclick = () => openStocktakeArea(b.dataset.area));
  };
  sheet({ title: '盤點', full: true, onMount: render, refresh: render });
}
function openStocktakeArea(areaId) {
  const area = S.areas.find(a => a.id === areaId);
  const confirmed = new Set();
  const render = ctx => {
    const groups = area ? area.spots.map(s => ({ name: s.name, items: S.products.filter(p => p.spotId === s.id) })).filter(g => g.items.length)
      : [{ name: '未指定位置', items: S.products.filter(p => !spotInfo(p.spotId)) }];
    const all = groups.flatMap(g => g.items);
    ctx.setTitle(`盤點：${area ? area.name : '未指定位置'}`);
    ctx.setBody(`<div class="small muted" style="margin:0 2px 8px">已確認 ${[...confirmed].filter(id => all.some(p => p.id === id)).length} / ${all.length} 項。數量正確按 ✓，不對就按「修改」。</div>
      ${groups.map(g => `<div class="list"><div class="sub-group-title">${esc(g.name)}</div>${g.items.map(p => `<div class="item ${confirmed.has(p.id) ? 'done-row' : ''}">
        ${thumbHTML(p)}<div class="main"><div class="name">${esc(p.name)}</div><div class="meta">系統記錄 ${esc(stockOf(p) > 0 ? fmtQty(p, stockOf(p)) : '0 ' + p.baseUnit)}</div></div>
        <button class="btn sm" data-fix="${p.id}">修改</button>
        <button class="check ${confirmed.has(p.id) ? 'on' : ''}" data-ok="${p.id}" aria-label="數量正確">${ic('check')}</button></div>`).join('')}</div>`).join('')}`);
    ctx.setFoot(`<button class="btn" data-scan>${ic('scan')}掃碼加入</button><button class="btn primary" data-done>完成此區</button>`);
    ctx.$$('[data-ok]').forEach(b => b.onclick = () => { const id = b.dataset.ok; confirmed.has(id) ? confirmed.delete(id) : confirmed.add(id); render(ctx); });
    ctx.$$('[data-fix]').forEach(b => b.onclick = () => stocktakeFix(prodById(b.dataset.fix), () => { confirmed.add(b.dataset.fix); }));
    ctx.$('[data-scan]').onclick = () => openScanner({ mode: 'in' });
    ctx.$('[data-done]').onclick = async () => {
      const left = all.filter(p => !confirmed.has(p.id)).length;
      if (left && !await confirmDialog(`還有 ${left} 項沒有確認，仍要完成這一區嗎？沒確認的會維持原本的數量。`, { ok: '完成' })) return;
      if (area) area.checkedAt = Date.now();
      S.settings.lastStocktakeAt = Date.now();
      commit(); await closeTop(); toast('這一區盤點完成');
    };
  };
  sheet({ title: '', full: true, onMount: render, refresh: render });
}
function stocktakeFix(p, onDone) {
  const units = unitsOf(p);
  const u0 = p.outUnit || p.baseUnit;
  const cur = stockOf(p);
  const startVal = round(cur / factorOf(p, u0));
  sheet({
    title: `實際數量：${p.name}`,
    body: `<div class="field"><label>實際數到的數量</label>${stepperHTML(startVal, units, u0)}<div class="hint">系統記錄 ${esc(fmtQty(p, cur))}。減少時會先從最早到期的批次扣除；增加的部分會記成沒有到期日的新批次，可以之後在商品頁修改。</div></div>`,
    foot: `<button class="btn" data-no>取消</button><button class="btn primary" data-yes>儲存</button>`,
    onMount: ctx => {
      bindStepper(ctx);
      ctx.$('[data-dec]').onclick = () => { const q = ctx.$('[data-qty]'); q.value = Math.max(0, round((+q.value || 0) - 1)); };
      ctx.$('[data-no]').onclick = () => closeTop();
      ctx.$('[data-yes]').onclick = async () => {
        const q = +ctx.$('[data-qty]').value;
        if (!(q >= 0)) return toast('數量不正確');
        const unit = ctx.$('[data-unit]')?.value || p.baseUnit;
        snapshot();
        adjustTo(p, q * factorOf(p, unit));
        onDone && onDone();
        commit(); await closeTop();
        toast(`${p.name} 已修正為 ${fmtQty(p, stockOf(p)) || 0}`, { label: '復原', fn: undo });
      };
    },
  });
}

/* =========================================================
   Changelog
   ========================================================= */
function openChangelog(justUpdated = false) {
  sheet({
    title: justUpdated ? `已更新到 v${APP_VERSION}` : '更新內容',
    body: CHANGELOG.map(c => `<div class="section-title" style="margin-top:${c === CHANGELOG[0] ? 4 : 18}px"><span>v${c.v}</span><span class="count">${c.date}</span></div>
      <div class="card"><ul class="cl">${c.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join(''),
    foot: `<button class="btn primary block" data-ok>${justUpdated ? '知道了' : '關閉'}</button>`,
    onMount: ctx => { ctx.$('[data-ok]').onclick = () => closeTop(); },
    onClose: () => { if (S.settings.seenVersion !== APP_VERSION) { S.settings.seenVersion = APP_VERSION; save(); } },
  });
}

/* =========================================================
   Backup (with photos)
   ========================================================= */
async function buildBackup(pw) {
  const payload = JSON.stringify({ state: S, photos: await Photos.all() });
  const head = { app: 'home-pantry', format: 2, version: APP_VERSION, exportedAt: new Date().toISOString() };
  if (!pw) return `{"app":"home-pantry","format":2,"version":${JSON.stringify(APP_VERSION)},"exportedAt":${JSON.stringify(head.exportedAt)},"encrypted":false,"data":${payload}}`;
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(payload)));
  return JSON.stringify({ ...head, encrypted: true, salt: b64.enc(salt), iv: b64.enc(iv), data: b64.enc(ct) });
}
function verNewer(a, b) { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; }
async function readBackup(text, askPw) {
  let obj; try { obj = JSON.parse(text); } catch (e) { throw new Error('這不是有效的備份檔'); }
  if (obj.app !== 'home-pantry') throw new Error('這不是家庭庫存的備份檔');
  let data = obj.data;
  if (obj.encrypted) {
    const pw = await askPw(); if (pw == null) throw new Error('cancel');
    try {
      const key = await deriveKey(pw, b64.dec(obj.salt));
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(obj.iv) }, key, b64.dec(obj.data));
      data = JSON.parse(new TextDecoder().decode(pt));
    } catch (e) { throw new Error('密碼錯誤，無法解開備份'); }
  }
  const out = (obj.format || 1) >= 2 ? { state: data.state, photos: data.photos || {} } : { state: data, photos: {} };
  out.version = obj.version || '1.0.0';
  out.newer = verNewer(out.version, APP_VERSION);
  return out;
}
