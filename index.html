/* =========================================================
   Camera: expiry date OCR (on device, photo never stored)
   ========================================================= */
const TESS_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let tessWorker = null;
async function getTess(onStatus) {
  if (tessWorker) return tessWorker;
  onStatus('第一次使用，正在下載辨識資料…');
  await loadScript(TESS_SRC);
  tessWorker = await Tesseract.createWorker('eng', 1, {
    logger: m => { if (m.status && m.progress != null && /load|initializ/i.test(m.status)) onStatus(`準備辨識中 ${Math.round(m.progress * 100)}%`); },
  });
  await tessWorker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
  return tessWorker;
}

function preprocess(src, variant) {
  const w = src.width, h = src.height;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(src, 0, 0);
  const img = g.getImageData(0, 0, w, h); const d = img.data;
  const gray = new Float32Array(w * h);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) gray[j] = d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114;
  let a = gray;
  if (variant === 'dots') { // 模糊讓點陣字的點連起來
    const r = Math.max(1, Math.round(w / 450));
    const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
    for (let y = 0; y < h; y++) { let s = 0; for (let x = -r; x <= r; x++) s += gray[y * w + Math.min(w - 1, Math.max(0, x))]; for (let x = 0; x < w; x++) { tmp[y * w + x] = s / (2 * r + 1); s += gray[y * w + Math.min(w - 1, x + r + 1)] - gray[y * w + Math.max(0, x - r)]; } }
    for (let x = 0; x < w; x++) { let s = 0; for (let y = -r; y <= r; y++) s += tmp[Math.min(h - 1, Math.max(0, y)) * w + x]; for (let y = 0; y < h; y++) { out[y * w + x] = s / (2 * r + 1); s += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; } }
    a = out;
  }
  // Otsu 二值化
  const hist = new Array(256).fill(0);
  for (const v of a) hist[Math.max(0, Math.min(255, v | 0))]++;
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, th = 127; const total = a.length;
  for (let i = 0; i < 256; i++) { wB += hist[i]; if (!wB) continue; const wF = total - wB; if (!wF) break; sumB += i * hist[i]; const mB = sumB / wB, mF = (sum - sumB) / wF; const between = wB * wF * (mB - mF) ** 2; if (between > best) { best = between; th = i; } }
  let dark = 0; for (const v of a) if (v < th) dark++;
  const invert = dark > total * .55; // 淺色字深色底時反轉
  for (let j = 0, i = 0; j < a.length; j++, i += 4) { let v = a[j] < th ? 0 : 255; if (invert) v = 255 - v; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  return c;
}

function openDateOCR(onPick) {
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `<div class="cam">
      <video muted playsinline></video>
      <div class="frame date"></div>
      <div class="cam-top">
        <button class="icon-btn" data-close aria-label="關閉">${ic('x')}</button>
        <div class="grow"><b>拍到期日</b><div class="small" style="opacity:.8">照片只用來辨識，不會儲存</div></div>
        <button class="icon-btn" data-torch aria-label="手電筒" hidden>${ic('flash')}</button>
      </div>
      <div class="cam-bottom">
        <div class="cam-msg" data-msg>把日期放進框內，盡量拿穩、避開反光</div>
        <div class="cands" data-cands style="margin-top:10px"></div>
        <button class="shutter" data-shot aria-label="拍照辨識"></button>
      </div>
    </div>`;
  const video = $('video', el), msg = $('[data-msg]', el), cands = $('[data-cands]', el), shot = $('[data-shot]', el);
  let running = true, busy = false;
  const work = [];
  const cleanup = () => { running = false; Cam.stop(video); work.forEach(c => { c.width = c.height = 0; }); work.length = 0; };
  pushOverlay(el, { onClose: cleanup });
  $('[data-close]', el).onclick = () => closeTop();
  let torchOn = false;
  $('[data-torch]', el).onclick = async e => { torchOn = !torchOn; await Cam.torch(torchOn); e.currentTarget.classList.toggle('on', torchOn); };

  (async () => {
    try { await Cam.start(video); if (!running) return Cam.stop(video); if (Cam.canTorch()) $('[data-torch]', el).hidden = false; }
    catch (e) { msg.textContent = e.name === 'NotAllowedError' ? '沒有相機權限，請在 Chrome 設定中允許。' : '無法開啟相機。'; shot.hidden = true; }
  })();

  shot.onclick = async () => {
    if (busy || !video.videoWidth) return;
    busy = true; shot.style.opacity = .4; cands.innerHTML = '';
    try {
      // 依畫面上框的位置裁切
      const fr = $('.frame', el).getBoundingClientRect(), vr = video.getBoundingClientRect();
      const vw = video.videoWidth, vh = video.videoHeight;
      const scale = Math.max(vr.width / vw, vr.height / vh); // object-fit: cover
      const ox = (vr.width - vw * scale) / 2, oy = (vr.height - vh * scale) / 2;
      let sx = (fr.left - vr.left - ox) / scale, sy = (fr.top - vr.top - oy) / scale, sw = fr.width / scale, sh = fr.height / scale;
      const padX = sw * .06, padY = sh * .15;
      sx = Math.max(0, sx - padX); sy = Math.max(0, sy - padY); sw = Math.min(vw - sx, sw + padX * 2); sh = Math.min(vh - sy, sh + padY * 2);
      const outW = Math.min(1600, Math.max(900, sw));
      const k = outW / sw;
      const crop = document.createElement('canvas'); work.push(crop);
      crop.width = Math.round(sw * k); crop.height = Math.round(sh * k);
      crop.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, crop.width, crop.height);
      const w = await getTess(s => { msg.textContent = s; });
      if (!running) return;
      msg.textContent = '辨識中…';
      const v1 = preprocess(crop, 'plain'); work.push(v1);
      const r1 = await w.recognize(v1);
      let text = r1.data.text;
      let dates = DateParse.parse(text);
      if (!running) return;
      if (dates.length < 1) {
        const v2 = preprocess(crop, 'dots'); work.push(v2);
        const r2 = await w.recognize(v2);
        text += '\n' + r2.data.text;
        dates = DateParse.parse(text);
      }
      // 用完立即清掉影像
      work.forEach(c => { c.width = c.height = 0; }); work.length = 0;
      if (!running) return;
      if (dates.length) {
        msg.textContent = '找到以下日期，點選正確的那一個';
        cands.innerHTML = dates.map(d => `<button data-d="${d}">${fmtDate(d)}</button>`).join('');
        $$('[data-d]', cands).forEach(b => b.onclick = async () => { const d = b.dataset.d; await closeTop(); onPick(d); toast(`已填入 ${fmtDate(d)}，請確認是否正確`); });
      } else {
        msg.textContent = '沒有辨識出日期，再拍一次，或關閉後手動輸入';
      }
    } catch (e) {
      console.error(e);
      msg.textContent = navigator.onLine ? '辨識失敗，請再試一次' : '第一次使用需要連網下載辨識資料';
    } finally {
      busy = false; shot.style.opacity = 1;
    }
  };
}

function moveIn(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }

/* categories */
function openCategories() {
  const render = ctx => {
    ctx.setBody(`<div class="hint" style="margin:0 2px 10px">點分類可以設定它的提醒預設；商品可以再個別調整。</div>
      <div class="list">${S.categories.map((c, i) => {
        const n = S.products.filter(p => p.categoryId === c.id).length;
        const plan = planById(c.planId) || planById(S.settings.defaultPlanId);
        const flags = [c.exp ? `到期・${plan?.name}` : '到期關', c.low ? '低庫存' : '低庫存關', c.forecast ? '快用完' : '快用完關'].join('、');
        return `<div class="edit-row"><div class="grow tap" data-edit="${c.id}"><div style="font-weight:600">${esc(c.name)} <span class="muted small">${n} 項</span></div><div class="small muted ellipsis">${esc(flags)}</div></div>
          <button class="icon-btn" data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="上移">${ic('up')}</button>
          <button class="icon-btn" data-down="${i}" ${i === S.categories.length - 1 ? 'disabled' : ''} aria-label="下移">${ic('down')}</button></div>`;
      }).join('')}</div>`);
    ctx.setFoot(`<button class="btn primary block" data-add>${ic('plus')}新增分類</button>`);
    ctx.$$('[data-up]').forEach(b => b.onclick = () => { moveIn(S.categories, +b.dataset.up, -1); commit(); });
    ctx.$$('[data-down]').forEach(b => b.onclick = () => { moveIn(S.categories, +b.dataset.down, 1); commit(); });
    ctx.$$('[data-edit]').forEach(b => b.onclick = () => editCategory(b.dataset.edit));
    ctx.$('[data-add]').onclick = async () => {
      const name = (await promptDialog('新增分類', { placeholder: '例如：嬰兒用品' }) || '').trim();
      if (!name) return;
      if (S.categories.some(c => c.name === name)) return toast('已經有這個分類');
      S.categories.push({ id: uid(), name, planId: null, low: true, exp: true, forecast: true }); commit();
    };
  };
  sheet({ title: '分類', full: true, onMount: render, refresh: render });
}
function editCategory(id) {
  const c = catById(id); if (!c) return;
  const sw = (key, title, desc) => `<div class="switch-row"><div class="grow"><div>${title}</div><div class="small muted">${desc}</div></div><label class="switch"><input type="checkbox" data-sw="${key}" ${c[key] ? 'checked' : ''}><span></span></label></div>`;
  sheet({
    title: `分類：${c.name}`,
    body: `<div class="field"><label>名稱</label><input class="input" data-name value="${esc(c.name)}"></div>
      <div class="field"><label>到期提醒方案</label><select class="input" data-plan>${planOptions(c.planId, `使用預設（${planById(S.settings.defaultPlanId)?.name || ''}）`)}</select></div>
      <div class="card" style="padding:2px 14px">
        ${sw('exp', '到期提醒', '快到期或過期時顯示在首頁')}
        ${sw('low', '低庫存提醒', '庫存不足時提醒並加入購物清單')}
        ${sw('forecast', '快用完提醒', '依消耗週期預測快用完時提醒')}
      </div>
      <div class="hint" style="margin:6px 2px 14px">這是此分類商品的預設值，個別商品可以在「編輯商品」另外設定。</div>
      <button class="btn danger block" data-del>${ic('trash')}刪除分類</button>`,
    foot: `<button class="btn primary block" data-ok>儲存</button>`,
    onMount: ctx => {
      ctx.$('[data-ok]').onclick = () => {
        const name = ctx.$('[data-name]').value.trim();
        if (!name) return toast('請輸入名稱');
        if (S.categories.some(x => x.name === name && x.id !== c.id)) return toast('已經有這個分類');
        c.name = name; c.planId = ctx.$('[data-plan]').value || null;
        ctx.$$('[data-sw]').forEach(s => { c[s.dataset.sw] = s.checked; });
        commit(); closeTop();
      };
      ctx.$('[data-del]').onclick = async () => {
        const items = S.products.filter(p => p.categoryId === c.id);
        if (S.categories.length <= 1) return toast('至少要保留一個分類');
        if (items.length) {
          const others = S.categories.filter(x => x.id !== c.id);
          sheet({
            title: '先移動商品',
            body: `<p style="margin:0 0 10px">「${esc(c.name)}」裡還有 ${items.length} 項商品，要先把它們移到其他分類，才能刪除。</p>
              <div class="field"><label>移到</label><select class="input" data-to>${others.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select></div>`,
            foot: `<button class="btn" data-no>取消</button><button class="btn danger" data-yes>移動並刪除</button>`,
            onMount: c2 => {
              c2.$('[data-no]').onclick = () => closeTop();
              c2.$('[data-yes]').onclick = async () => {
                const to = c2.$('[data-to]').value;
                items.forEach(p => { p.categoryId = to; });
                S.categories = S.categories.filter(x => x.id !== c.id);
                commit(); await closeTop(); await closeTop(); toast('已刪除分類');
              };
            },
          });
          return;
        }
        if (!await confirmDialog(`刪除分類「${esc(c.name)}」？`, { ok: '刪除', danger: true })) return;
        S.categories = S.categories.filter(x => x.id !== c.id); commit(); await closeTop();
      };
    },
  });
}

/* areas */
function openAreas() {
  const render = ctx => {
    ctx.setBody(`<div class="hint" style="margin:0 2px 10px">兩層：區域 → 位置，例如「廚房 → 冰箱」。</div>` + S.areas.map((a, i) => `
      <div class="section-title" style="margin-top:12px"><span>${esc(a.name)}</span>
        <span class="row" style="gap:2px">
          <button class="icon-btn ghost" data-aup="${i}" ${i === 0 ? 'disabled' : ''} aria-label="上移">${ic('up')}</button>
          <button class="icon-btn ghost" data-adown="${i}" ${i === S.areas.length - 1 ? 'disabled' : ''} aria-label="下移">${ic('down')}</button>
          <button class="icon-btn ghost" data-aedit="${a.id}" aria-label="改名">${ic('edit')}</button>
          <button class="icon-btn ghost" data-adel="${a.id}" aria-label="刪除">${ic('trash')}</button>
        </span></div>
      <div class="list">${a.spots.map((s, j) => `<div class="edit-row"><span class="grow">${esc(s.name)} <span class="muted small">${S.products.filter(p => p.spotId === s.id).length} 項</span></span>
        <button class="icon-btn" data-sup="${a.id}|${j}" ${j === 0 ? 'disabled' : ''} aria-label="上移">${ic('up')}</button>
        <button class="icon-btn" data-sdown="${a.id}|${j}" ${j === a.spots.length - 1 ? 'disabled' : ''} aria-label="下移">${ic('down')}</button>
        <button class="icon-btn" data-sedit="${a.id}|${s.id}" aria-label="改名">${ic('edit')}</button>
        <button class="icon-btn" data-sdel="${a.id}|${s.id}" aria-label="刪除">${ic('trash')}</button></div>`).join('')}
        <button class="setting-row" data-sadd="${a.id}" style="color:var(--accent);font-weight:600">${ic('plus', 'lead')}<span class="grow">新增位置</span></button></div>`).join(''));
    ctx.setFoot(`<button class="btn primary block" data-add>${ic('plus')}新增區域</button>`);
    const A = id => S.areas.find(a => a.id === id);
    ctx.$$('[data-aup]').forEach(b => b.onclick = () => { moveIn(S.areas, +b.dataset.aup, -1); commit(); });
    ctx.$$('[data-adown]').forEach(b => b.onclick = () => { moveIn(S.areas, +b.dataset.adown, 1); commit(); });
    ctx.$$('[data-sup]').forEach(b => b.onclick = () => { const [a, j] = b.dataset.sup.split('|'); moveIn(A(a).spots, +j, -1); commit(); });
    ctx.$$('[data-sdown]').forEach(b => b.onclick = () => { const [a, j] = b.dataset.sdown.split('|'); moveIn(A(a).spots, +j, 1); commit(); });
    ctx.$$('[data-aedit]').forEach(b => b.onclick = async () => { const a = A(b.dataset.aedit); const n = (await promptDialog('區域名稱', { value: a.name }) || '').trim(); if (n) { a.name = n; commit(); } });
    ctx.$$('[data-sedit]').forEach(b => b.onclick = async () => { const [aid, sid] = b.dataset.sedit.split('|'); const s = A(aid).spots.find(x => x.id === sid); const n = (await promptDialog('位置名稱', { value: s.name }) || '').trim(); if (n) { s.name = n; commit(); } });
    ctx.$$('[data-sadd]').forEach(b => b.onclick = async () => { const a = A(b.dataset.sadd); const n = (await promptDialog(`在「${a.name}」新增位置`, { placeholder: '例如：上層櫥櫃' }) || '').trim(); if (n) { a.spots.push({ id: uid(), name: n }); commit(); } });
    ctx.$('[data-add]').onclick = async () => { const n = (await promptDialog('新增區域', { placeholder: '例如：陽台' }) || '').trim(); if (n) { S.areas.push({ id: uid(), name: n, spots: [{ id: uid(), name: '一般' }] }); commit(); toast('已新增，預設有一個「一般」位置'); } };
    const allSpots = () => S.areas.flatMap(a => a.spots.map(s => ({ a, s })));
    const moveThenDelete = (items, excludeIds, label, onDone) => {
      const targets = allSpots().filter(x => !excludeIds.includes(x.s.id));
      sheet({
        title: '先移動商品',
        body: `<p style="margin:0 0 10px">「${esc(label)}」裡還有 ${items.length} 項商品，要先移到其他位置才能刪除。</p>
          <div class="field"><label>移到</label><select class="input" data-to><option value="">未指定位置</option>${targets.map(x => `<option value="${x.s.id}">${esc(x.a.name)}・${esc(x.s.name)}</option>`).join('')}</select></div>`,
        foot: `<button class="btn" data-no>取消</button><button class="btn danger" data-yes>移動並刪除</button>`,
        onMount: c2 => {
          c2.$('[data-no]').onclick = () => closeTop();
          c2.$('[data-yes]').onclick = async () => { const to = c2.$('[data-to]').value; items.forEach(p => { p.spotId = to; }); onDone(); commit(); await closeTop(); toast('已刪除'); };
        },
      });
    };
    ctx.$$('[data-sdel]').forEach(b => b.onclick = async () => {
      const [aid, sid] = b.dataset.sdel.split('|'); const a = A(aid); const s = a.spots.find(x => x.id === sid);
      const items = S.products.filter(p => p.spotId === sid);
      const del = () => { a.spots = a.spots.filter(x => x.id !== sid); };
      if (items.length) return moveThenDelete(items, [sid], `${a.name}・${s.name}`, del);
      if (await confirmDialog(`刪除位置「${esc(a.name)}・${esc(s.name)}」？`, { ok: '刪除', danger: true })) { del(); commit(); }
    });
    ctx.$$('[data-adel]').forEach(b => b.onclick = async () => {
      const a = A(b.dataset.adel); const ids = a.spots.map(s => s.id);
      const items = S.products.filter(p => ids.includes(p.spotId));
      const del = () => { S.areas = S.areas.filter(x => x.id !== a.id); };
      if (items.length) return moveThenDelete(items, ids, a.name, del);
      if (await confirmDialog(`刪除區域「${esc(a.name)}」和它的所有位置？`, { ok: '刪除', danger: true })) { del(); commit(); }
    });
  };
  sheet({ title: '區域與位置', full: true, onMount: render, refresh: render });
}

/* plans */
function openPlans() {
  const render = ctx => {
    ctx.setBody(`<div class="hint" style="margin:0 2px 10px">建立幾種「到期前多久提醒」的標準，再套用到分類或個別商品。</div>
      <div class="list">${S.plans.map(p => {
        const usedC = S.categories.filter(c => c.planId === p.id).length, usedP = S.products.filter(x => x.planId === p.id).length;
        return `<button class="setting-row" data-edit="${p.id}">${ic('clock', 'lead')}<span class="grow"><div style="font-weight:600">${esc(p.name)}${p.id === S.settings.defaultPlanId ? ' <span class="chip ok">預設</span>' : ''}</div><div class="small muted">到期前 ${p.lead} ${UNIT_LABEL[p.unit]}・${usedC} 個分類、${usedP} 項商品使用</div></span>${ic('chev', 'chev')}</button>`;
      }).join('')}</div>`);
    ctx.setFoot(`<button class="btn primary block" data-add>${ic('plus')}新增方案</button>`);
    ctx.$$('[data-edit]').forEach(b => b.onclick = () => editPlan(b.dataset.edit));
    ctx.$('[data-add]').onclick = () => editPlan(null);
  };
  sheet({ title: '到期提醒方案', full: true, onMount: render, refresh: render });
}
function editPlan(id) {
  const p = id ? planById(id) : { id: uid(), name: '', lead: 7, unit: 'day' };
  sheet({
    title: id ? `方案：${p.name}` : '新增方案',
    body: `<div class="field"><label>名稱</label><input class="input" data-name value="${esc(p.name)}" placeholder="例如：冷藏品"></div>
      <div class="field"><label>到期前多久提醒</label><div class="row"><input class="input grow" type="number" inputmode="numeric" min="0" step="1" data-lead value="${p.lead}">
        <select class="input" style="width:110px" data-unit>${Object.entries(UNIT_LABEL).map(([k, v]) => `<option value="${k}" ${k === p.unit ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
      ${id && S.plans.length > 1 ? `<button class="btn danger block" data-del>${ic('trash')}刪除方案</button>` : ''}`,
    foot: `<button class="btn primary block" data-ok>儲存</button>`,
    onMount: ctx => {
      ctx.$('[data-ok]').onclick = () => {
        const name = ctx.$('[data-name]').value.trim(); const lead = Math.round(+ctx.$('[data-lead]').value);
        if (!name) return toast('請輸入名稱');
        if (!(lead >= 0)) return toast('天數不正確');
        p.name = name; p.lead = lead; p.unit = ctx.$('[data-unit]').value;
        if (!id) S.plans.push(p);
        commit(); closeTop();
      };
      const d = ctx.$('[data-del]');
      if (d) d.onclick = async () => {
        const fallback = S.plans.find(x => x.id !== p.id && x.id === S.settings.defaultPlanId) || S.plans.find(x => x.id !== p.id);
        if (!await confirmDialog(`刪除「${esc(p.name)}」？使用這個方案的分類和商品會改用「${esc(fallback.name)}」。`, { ok: '刪除', danger: true })) return;
        S.categories.forEach(c => { if (c.planId === p.id) c.planId = fallback.id; });
        S.products.forEach(x => { if (x.planId === p.id) x.planId = null; });
        if (S.settings.defaultPlanId === p.id) S.settings.defaultPlanId = fallback.id;
        S.plans = S.plans.filter(x => x.id !== p.id);
        commit(); closeTop();
      };
    },
  });
}

      <div class="field"><label>快用完提醒：預計幾天內用完</label><input class="input" type="number" inputmode="numeric" min="1" step="1" data-fc value="${st.forecastDays}"></div>
      <div class="field"><label>備份提醒間隔（天）</label><input class="input" type="number" inputmode="numeric" min="1" step="1" data-bk value="${st.backupDays}"><div class="hint">超過這麼多天沒備份，首頁就會提醒。</div></div>`,

        commit(); closeTop(); toast('已儲存');
      };
    },
  });
}

/* storage status */
async function requestPersist() {
  S.settings.persistAsked = true; save();
  try { if (navigator.storage?.persist) return await navigator.storage.persist(); } catch (e) {}
  return false;
}
async function openStorage() {
  let persisted = false, est = null;
  try { persisted = await navigator.storage?.persisted?.(); } catch (e) {}
  try { est = await navigator.storage?.estimate?.(); } catch (e) {}
  const ctx = sheet({
    title: '資料保存狀態',
    body: `<div class="card">
        <div class="row">${ic('shield')}<b class="grow">${persisted ? '已啟用永久保存' : '尚未啟用永久保存'}</b>${persisted ? '<span class="chip ok">安全</span>' : '<span class="chip warn">注意</span>'}</div>
        <p class="small muted" style="margin:8px 0 0">${persisted ? '手機空間不足時，Chrome 不會自動清掉這裡的資料。' : '手機空間不足時，Chrome 有可能清掉這裡的資料。把這個網頁「加到主畫面」後再按下方按鈕，通常就會核准。'}</p>
        ${persisted ? '' : `<button class="btn primary block" style="margin-top:10px" data-ask>申請永久保存</button>`}
      </div>
      <div class="card small">
        <div>商品 ${S.products.length} 項・批次 ${S.batches.length} 筆・紀錄 ${S.logs.length} 筆</div>
        ${est ? `<div class="muted">使用空間約 ${(est.usage / 1024).toFixed(0)} KB</div>` : ''}
      </div>
      <div class="banner info">${ic('alert')}<div class="small">清除 Chrome 的網站資料、移除 Chrome 或換手機時，資料都會不見。請定期備份。</div></div>`,
  });
  const a = ctx.$('[data-ask]');
  if (a) a.onclick = async () => { const ok = await requestPersist(); await closeTop(); toast(ok ? '已啟用永久保存' : '瀏覽器暫時沒有核准，先加到主畫面再試'); };
}

async function wipeAll() {
  if (!await confirmDialog('確定要清除<b>所有</b>商品、紀錄和設定嗎？這個動作無法復原，建議先備份。', { ok: '下一步', danger: true })) return;
  const v = await promptDialog('最後確認', { label: '請輸入「清除」兩個字', ok: '清除所有資料' });
  if ((v || '').trim() !== '清除') return toast('已取消');
  S = defaultState(); S.settings.onboarded = true; commit(); toast('已清除所有資料');
}

/* =========================================================
   Backup & restore
   ========================================================= */
const b64 = { enc: u8 => { let s = ''; u8.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); }, dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function buildBackup(pw) {
  const payload = JSON.stringify(S);
  const head = { app: 'home-pantry', format: 1, version: APP_VERSION, exportedAt: new Date().toISOString() };
  if (!pw) return JSON.stringify({ ...head, encrypted: false, data: JSON.parse(payload) });
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(payload)));
  return JSON.stringify({ ...head, encrypted: true, salt: b64.enc(salt), iv: b64.enc(iv), data: b64.enc(ct) });
}
async function readBackup(text, askPw) {
  let obj; try { obj = JSON.parse(text); } catch (e) { throw new Error('這不是有效的備份檔'); }
  if (obj.app !== 'home-pantry') throw new Error('這不是家庭庫存的備份檔');
  if (!obj.encrypted) return obj.data;
  const pw = await askPw(); if (pw == null) throw new Error('cancel');
  try {
    const key = await deriveKey(pw, b64.dec(obj.salt));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(obj.iv) }, key, b64.dec(obj.data));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch (e) { throw new Error('密碼錯誤，無法解開備份'); }
}
function validState(d) { return d && Array.isArray(d.products) && Array.isArray(d.batches) && Array.isArray(d.categories) && Array.isArray(d.areas) && d.settings; }

function openBackup() {
  const render = ctx => {
    const last = S.settings.lastBackupAt;
    ctx.setBody(`
      <div class="card"><div class="row">${ic('backup')}<div class="grow"><b>${last ? `上次備份：${fmtDate(toISO(new Date(last)))}` : '還沒有備份過'}</b>
        <div class="small muted">每 ${S.settings.backupDays} 天提醒一次，可在「預設值」調整</div></div></div></div>
      <div class="switch-row" style="padding:6px 2px 12px;border:0"><div class="grow"><div>${ic('lock').replace('<svg', '<svg style="width:16px;height:16px;vertical-align:-2px"')} 用密碼加密備份</div><div class="small muted">忘記密碼就無法還原，請記好</div></div><label class="switch"><input type="checkbox" data-enc><span></span></label></div>
      <button class="btn primary block" data-share>${ic('backup')}備份並分享到雲端硬碟…</button>
      <div class="hint" style="margin:6px 2px 10px">會跳出分享選單，選「雲端硬碟」即可存起來，也可以選 Email 或其他 App。</div>
      <button class="btn block" data-dl>${ic('in')}下載備份檔到手機</button>
      <div class="hint" style="margin:6px 2px 0">存在手機的「下載」資料夾。手機壞掉時會一起不見，建議另外存到雲端。</div>
      <div class="hr" style="margin:18px 0"></div>
      <button class="btn block" data-restore>${ic('restore')}從備份檔還原</button>
      <input type="file" accept=".json,.txt,application/json,text/plain" data-file hidden>
      <div class="hint" style="margin:6px 2px 0">還原會用備份檔<b>取代</b>目前手機裡的所有資料。</div>`);
    const enc = ctx.$('[data-enc]');
    const make = async () => {
      let pw = null;
      if (enc.checked) {
        pw = await promptDialog('設定備份密碼', { type: 'password', label: '密碼', hint: '還原時需要輸入這組密碼' });
        if (!pw) return null;
        const pw2 = await promptDialog('再輸入一次密碼', { type: 'password' });
        if (pw !== pw2) { toast('兩次密碼不一樣'); return null; }
      }
      return buildBackup(pw);
    };
    const name = ext => `home-pantry-backup_${todayISO()}.${ext}`;
    const markDone = () => { S.settings.lastBackupAt = Date.now(); commit(); };
    ctx.$('[data-share]').onclick = async () => {
      const text = await make(); if (!text) return;
      const file = new File([text], name('txt'), { type: 'text/plain' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: '家庭庫存備份' }); markDone(); toast('備份完成'); }
        catch (e) { if (e.name !== 'AbortError') { toast('分享失敗，改用下載'); download(text, name('json')); markDone(); } }
      } else { download(text, name('json')); markDone(); toast('這台手機不支援分享，已改為下載'); }
    };
    ctx.$('[data-dl]').onclick = async () => { const text = await make(); if (!text) return; download(text, name('json')); markDone(); toast('已下載備份檔'); };
    const fi = ctx.$('[data-file]');
    ctx.$('[data-restore]').onclick = () => { fi.value = ''; fi.click(); };
    fi.onchange = async () => {
      const f = fi.files[0]; if (!f) return;
      try {
        const data = await readBackup(await f.text(), () => promptDialog('輸入備份密碼', { type: 'password' }));
        if (!validState(data)) throw new Error('備份檔內容不完整');
        if (!await confirmDialog(`備份裡有 ${data.products.length} 項商品。確定要用它取代目前的資料（${S.products.length} 項商品）嗎？`, { ok: '還原', danger: true })) return;
        S = migrate(data); S.settings.onboarded = true; commit();
        await closeAll(); toast('還原完成');
      } catch (e) { if (e.message !== 'cancel') toast(e.message); }
    };
  };
  sheet({ title: '備份與還原', full: true, onMount: render, refresh: null });
}
function download(text, filename) {
  const blob = new Blob([text], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* =========================================================
   Onboarding
   ========================================================= */
function openOnboarding(fromSettings = false) {
  const pages = [
    { icon: 'box', t: '歡迎使用家庭庫存', p: ['用手機相機掃商品條碼，記錄家裡的耗材和食品：還剩多少、放在哪、什麼時候到期。', '第一次掃到的商品要輸入名稱和分類，之後再掃就會自動認得。'] },
    { icon: 'scan', t: '入庫與出庫', p: ['<b>買回家</b>：掃碼入庫，填數量和到期日（可以拍照辨識）。', '<b>用掉了</b>：掃碼出庫，或在庫存清單按「−」。系統會先扣最早到期的那批。', '衛生紙這類東西可以設定「1 袋 = 12 捲」，出庫一次扣一整袋。'] },
    { icon: 'bell', t: '提醒都在首頁', p: ['快到期、已過期、庫存不足和預計快用完的東西，打開首頁就看得到，也會自動列進購物清單。', '提醒標準可以依分類或個別商品調整，例如零食不提醒低庫存。', '這是網頁 App，<b>不會主動跳手機通知</b>，記得常打開看看。'] },
    { icon: 'shield', t: '資料只在這支手機裡', p: ['所有資料只存在這支手機的 Chrome 裡，不會上傳到任何地方。拍照辨識的照片用完就丟，不會儲存。', '<b>清除 Chrome 資料、移除 Chrome 或換手機，資料就會不見。</b>請到「設定 → 備份與還原」定期備份到雲端硬碟。', '建議把這個網頁「加到主畫面」，使用起來就像 App。'] },
  ];
  let i = 0;
  const render = ctx => {
    const pg = pages[i];
    ctx.setBody(`<div class="onb"><div class="ill">${ic(pg.icon)}</div><h3>${pg.t}</h3>${pg.p.map(x => `<p>${x}</p>`).join('')}
      <div class="dots">${pages.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div></div>`);
    ctx.setFoot(`${i > 0 ? '<button class="btn" data-prev>上一步</button>' : ''}<button class="btn primary" data-next>${i === pages.length - 1 ? '開始使用' : '下一步'}</button>`);
    const pv = ctx.$('[data-prev]'); if (pv) pv.onclick = () => { i--; render(ctx); };
    ctx.$('[data-next]').onclick = async () => {
      if (i < pages.length - 1) { i++; render(ctx); return; }
      S.settings.onboarded = true; commit();
      await closeTop();
      if (!fromSettings) requestPersist();
    };
  };
  sheet({ title: fromSettings ? '使用說明' : '', onMount: render, onClose: () => { if (!S.settings.onboarded) { S.settings.onboarded = true; save(); } } });
}

/* =========================================================
   Boot
   ========================================================= */
function migrate(d) {
  const base = defaultState();
  d.settings = { ...base.settings, ...(d.settings || {}) };
  for (const k of ['plans', 'categories', 'areas', 'products', 'batches', 'logs', 'shopping']) if (!Array.isArray(d[k])) d[k] = base[k];
  if (!d.plans.length) d.plans = base.plans;
  d.products.forEach(p => { p.barcodes = p.barcodes || []; p.packs = p.packs || []; p.alerts = p.alerts || {}; p.baseUnit = p.baseUnit || '個'; });
  d.schema = 1;
  return d;
}

async function boot() {
  try {
    const saved = await IDB.get('state');
    S = saved ? migrate(saved) : defaultState();
    if (!saved) await IDB.set('state', S);
  } catch (e) {
    console.error(e);
    S = defaultState();
    toast('無法使用手機儲存空間，資料不會被保存');
  }
  history.replaceState({ ov: 0 }, '');
  $$('.tabbar [data-tab]').forEach(b => b.onclick = async () => { await closeAll(); tab = b.dataset.tab; window.scrollTo(0, 0); renderMain(); });
  $('.tabbar [data-scanbtn]').onclick = () => openScanner({ mode: 'in' });
  renderMain();
  if (!S.settings.onboarded) openOnboarding();
  // 日期跨日時更新提醒
  document.addEventListener('visibilitychange', () => { if (!document.hidden) renderMain(); });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('已下載新版本', { label: '重新載入', fn: () => location.reload() });
        });
      });
    } catch (e) { console.warn('sw', e); }
  }
}
boot();

</script>
